{% extends "layout.html" %}
{% block title %}Create BOM Item{% endblock %}

{% block content %}
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-900">Create BOM Item</h2>
    <p class="text-sm text-slate-500 mt-1">Define a component relationship for an assembly part.</p>
  </div>

  <form class="space-y-4" method="post">
    <div>
      <label for="parent_part_number" class="block text-sm font-medium text-slate-700 mb-1">Assembly Part Number *</label>
      <input type="text" id="parent_part_number" name="parent_part_number" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
    </div>

    <div>
      <label for="component_part_number" class="block text-sm font-medium text-slate-700 mb-1">Component Part Number *</label>
      <input type="text" id="component_part_number" name="component_part_number" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="quantity_per_unit" class="block text-sm font-medium text-slate-700 mb-1">Quantity per Unit *</label>
        <input type="number" id="quantity_per_unit" name="quantity_per_unit" step="0.0001" min="0.0001" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
      </div>

      <div>
        <label for="revision" class="block text-sm font-medium text-slate-700 mb-1">Revision</label>
        <input type="text" id="revision" name="revision" value="A" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
      </div>
    </div>

    <div>
      <label for="designator" class="block text-sm font-medium text-slate-700 mb-1">Designator / Notes</label>
      <input type="text" id="designator" name="designator" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>

    <div class="flex items-center gap-3 pt-4">
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Create BOM Item</button>
      <a href="{{ url_for('bom.list_bom') }}" class="inline-flex items-center px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg border border-slate-300 shadow-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
