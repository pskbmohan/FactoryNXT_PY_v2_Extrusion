<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}FactoryNXT{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 64px; background: #ffffff;
      display: flex; align-items: center; padding: 0 24px;
      border-bottom: 1px solid #e2e8f0;
    }
    #topbar .toggle-btn {
      background: transparent; border: none; cursor: pointer; color: #64748b;
      padding: 8px; border-radius: 6px; transition: all 0.2s; display: flex; align-items: center;
    }
    #topbar .toggle-btn:hover { background: #f1f5f9; color: #0f172a; }
    #topbar .brand { color: #0f172a; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    #topbar .brand span { color: #4f46e5; }
    #topbar .top-right { margin-left: auto; display: flex; gap: 16px; align-items: center; }
    #topbar .top-right a {
      color: #475569; font-size: 14px; font-weight: 500; text-decoration: none;
      transition: color 0.2s; display: flex; align-items: center; gap: 6px;
    }
    #topbar .top-right a:hover { color: #0f172a; }

    #sidebar {
      position: fixed; top: 64px; left: 0; bottom: 0; z-index: 150;
      width: 260px; background: #ffffff;
      border-right: 1px solid #e2e8f0;
      overflow-y: auto; overflow-x: hidden;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;
    }
    #sidebar.collapsed { width: 72px; }
    #sidebar::-webkit-scrollbar { width: 4px; }
    #sidebar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    #sidebar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .sidebar-label {
      color: #94a3b8; font-size: 11px; font-weight: 600;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 24px 16px 8px; white-space: nowrap; transition: opacity 0.2s;
    }
    #sidebar.collapsed .sidebar-label { opacity: 0; pointer-events: none; }

    .nav-group > .group-header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer;
      color: #475569; font-size: 14px; font-weight: 500;
      border-left: 2px solid transparent;
      transition: all 0.2s ease;
      user-select: none; position: relative;
    }
    .nav-group > .group-header:hover { background: #f8fafc; color: #0f172a; }
    .nav-group > .group-header .icon {
      width: 20px; height: 20px; min-width: 20px; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; transition: color 0.2s;
    }
    .nav-group > .group-header:hover .icon { color: #64748b; }
    .nav-group > .group-header .label-text { flex: 1; white-space: nowrap; overflow: hidden; transition: opacity 0.2s; }
    .nav-group > .group-header .arrow { width: 16px; height: 16px; transition: transform 0.2s; color: #94a3b8; }
    .nav-group.open > .group-header .arrow { transform: rotate(90deg); }
    #sidebar.collapsed .nav-group > .group-header .label-text,
    #sidebar.collapsed .nav-group > .group-header .arrow { opacity: 0; pointer-events: none; }

    .nav-children { overflow: hidden; max-height: 0; transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1); background: #ffffff; }
    .nav-group.open .nav-children { max-height: 800px; }
    #sidebar.collapsed .nav-children { max-height: 0 !important; }

    .nav-children a {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 16px 8px 50px;
      color: #64748b; font-size: 13.5px; font-weight: 400; text-decoration: none;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .nav-children a:hover { background: #f1f5f9; color: #0f172a; }
    .nav-children a.active { background: #eef2ff; color: #4338ca; border-left: 2px solid #4338ca; font-weight: 500; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer;
      color: #475569; font-size: 14px; font-weight: 500;
      border-left: 2px solid transparent;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-item:hover { background: #f8fafc; color: #0f172a; }
    .nav-item.active { background: #eef2ff; color: #4338ca; border-left: 2px solid #4338ca; font-weight: 500; }
    .nav-item .icon {
      width: 20px; height: 20px; min-width: 20px; display: flex; align-items: center; justify-content: center;
      color: #94a3b8; transition: color 0.2s;
    }
    .nav-item:hover .icon { color: #64748b; }
    .nav-item.active .icon { color: #4338ca; }
    .nav-item .label-text { white-space: nowrap; overflow: hidden; transition: opacity 0.2s; }
    #sidebar.collapsed .nav-item .label-text { opacity: 0; pointer-events: none; }

    #sidebar.collapsed .nav-group > .group-header { position: relative; justify-content: center; padding: 10px 0; }
    #sidebar.collapsed .group-header:hover::after,
    #sidebar.collapsed .nav-item:hover::after {
      content: attr(data-tip);
      position: absolute; left: 70px; top: 50%; transform: translateY(-50%);
      background: #0f172a; color: #ffffff; font-size: 12px; font-weight: 500;
      padding: 6px 10px; border-radius: 6px; white-space: nowrap;
      pointer-events: none; z-index: 9999;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    #sidebar.collapsed .nav-item { position: relative; justify-content: center; padding: 10px 0; }

    #main-content {
      margin-top: 64px; margin-left: 260px;
      padding: 32px; flex: 1;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: calc(100vh - 64px);
      background-color: #f8fafc;
    }
    #main-content.collapsed { margin-left: 72px; }

    .flash-wrap { margin-bottom: 24px; }
    .flash-msg { padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 8px; border: 1px solid transparent; }
    .flash-msg.success { background: #f0fdf4; color: #166534; border-color: #bbf7d0; border-left-width: 4px; }
    .flash-msg.error   { background: #fef2f2; color: #991b1b; border-color: #fecaca; border-left-width: 4px; }
    .flash-msg.info    { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; border-left-width: 4px; }

    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); width: 260px !important; }
      #sidebar.mobile-open { transform: translateX(0); }
      #main-content, #main-content.collapsed { margin-left: 0; padding: 16px; }
    }
  </style>
</head>
<body>
<!-- TOP BAR -->
<div id="topbar">
  <button class="toggle-btn" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>
  <span class="brand">Factory<span>NXT</span></span>
  <div class="top-right">
    <a href="{{ url_for('auth.login') }}">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-6.5 3.75 3.75 3.75 0 016.5-3.75zM4.5 21.75h15a2.25 2.25 0 002.25-2.25v-1.5a2.25 2.25 0 00-2.25-2.25h-15a2.25 2.25 0 00-2.25 2.25v1.5a2.25 2.25 0 002.25 2.25z" />
      </svg>
      <span>Login</span>
    </a>
  </div>
</div>
<!-- END TOP BAR -->
  {% block content %}{% endblock %}
</body></html>
