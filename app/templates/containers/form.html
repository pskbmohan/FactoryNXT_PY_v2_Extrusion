{% extends "layout.html" %}
{% block title %}New Container{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">New Container</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Register a tray, basket, rack or bin</p>
  </div>

  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-6">
    <fieldset>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Container Code *</label>
          <input type="text" name="container_code" required autofocus
                 class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Type</label>
          <select name="container_type"
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
            {% for t in ['tray','basket','rack','bin'] %}<option value="{{ t }}">{{ t|capitalize }}</option>{% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Material</label>
          <select name="material"
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
            <option value="">—</option>
            {% for m in ['steel','aluminum','plastic','wood'] %}<option value="{{ m }}">{{ m|capitalize }}</option>{% endfor %}
          </select>
        </div>
      </div>
    </fieldset>
    <fieldset>
      <legend class="text-sm font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-4">Capacity</legend>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Tare Weight (kg)</label>
          <input type="number" step="0.01" name="tare_weight_kg"
                 class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Max Capacity (kg)</label>
          <input type="number" step="0.01" name="max_capacity_kg"
                 class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Max Units</label>
          <input type="number" name="max_capacity_units"
                 class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
    </fieldset>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Initial Location</label>
      <input type="text" name="current_location" value="Store"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
    </div>

    <div class="flex items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <button type="submit"
              class="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">Register Container</button>
      <a href="{{ url_for('containers.list_containers') }}"
         class="px-6 py-2.5 text-slate-600 dark:text-slate-400 text-sm font-medium hover:text-slate-900">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
