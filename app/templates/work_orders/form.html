{% extends "layout.html" %}
{% block title %}Create Work Order{% endblock %}
{% block content %}
<div class="mb-6">
  <h2 class="text-2xl font-bold text-slate-900">Create Work Order</h2>
  <p class="text-sm text-slate-500">Fill in the details to create a new production work order.</p>
</div>
<form class="max-w-2xl space-y-4" method="post" action="{{ url_for('work_orders.list_create_work_orders') }}">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Order Number *</label>
      <input type="text" name="order_number" placeholder="e.g. WO-2024-001" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Part Number *</label>
      <input type="text" name="part_number" placeholder="e.g. PCB-ABC-001" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
    <input type="text" name="description" placeholder="Optional description" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Quantity *</label>
      <input type="number" name="quantity" min="1" value="100" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Due Date *</label>
      <input type="date" name="due_date" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-2">Priority</label>
    <div class="flex flex-wrap gap-4">
      <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
        <input type="radio" name="priority" value="Low" class="rounded-full border-slate-300 text-primary-600 focus:ring-primary-500" /> Low
      </label>
      <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
        <input type="radio" name="priority" value="Normal" checked class="rounded-full border-slate-300 text-primary-600 focus:ring-primary-500" /> Normal
      </label>
      <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
        <input type="radio" name="priority" value="High" class="rounded-full border-slate-300 text-primary-600 focus:ring-primary-500" /> High
      </label>
      <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
        <input type="radio" name="priority" value="Critical" class="rounded-full border-slate-300 text-primary-600 focus:ring-primary-500" /> Critical
      </label>
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
    <div class="relative max-w-xs">
      <select name="status" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
        <option value="Draft" selected>Draft</option>
        <option value="Released">Released</option>
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </div>
    </div>
  </div>
  <div class="flex gap-3 pt-2">
    <button class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm" type="submit">Create Work Order</button>
    <a class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg shadow-sm" href="{{ url_for('work_orders.list_create_work_orders') }}">Cancel</a>
  </div>
</form>
{% endblock %}
