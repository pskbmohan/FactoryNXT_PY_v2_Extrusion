{% extends "layout.html" %}
{% block title %}New Finishing Order{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">New Finishing Order</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Create a post-extrusion finishing step</p>
  </div>

  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Order Number *</label>
        <input type="text" name="order_number" required autofocus
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Work Order *</label>
        <select name="wo_id" required
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="">— Select —</option>
          {% for wo in work_orders %}<option value="{{ wo.id }}">{{ wo.order_number }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Process Type *</label>
        <select name="process_type_id" required
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="">— Select —</option>
          {% for pt in process_types %}<option value="{{ pt.id }}">{{ pt.name }} {{ '(PLC)' if pt.requires_plc_instruction else '' }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Container</label>
        <select name="container_id"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="">— None —</option>
          {% for c in containers %}<option value="{{ c.id }}">{{ c.container_code }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Sequence</label>
        <input type="number" name="sequence" value="1" min="1"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Operator</label>
        <input type="text" name="operator_id" value="Operator"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
        Process Parameters (JSON)
      </label>
      <textarea name="parameters_json" rows="4" placeholder='{"temp_c": 180, "duration_min": 60, "pressure_bar": 2.5}'
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm font-mono focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>

    <div class="flex items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">Create Order</button>
      <a href="{{ url_for('finishing.list_orders') }}" class="px-6 py-2.5 text-slate-600 dark:text-slate-400 text-sm font-medium">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
