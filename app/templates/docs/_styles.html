<style>
/* docs styles */
.docs-page { font-family: 'Inter', system-ui, sans-serif; }

/* Sidebar */
.docs-sidebar { width:260px; background:#1a1a2e; position:fixed; top:0; left:0;
  height:100vh; overflow-y:auto; padding:0 0 20px; z-index:100; }
.docs-sidebar .logo { color:#e94560; font-size:1.3rem; font-weight:700;
  padding:24px 20px 16px; display:block; text-decoration:none; }
.sidebar-category { color:#8892a4; font-size:0.7rem; text-transform:uppercase;
  letter-spacing:1.5px; padding:18px 20px 6px; font-weight:600; }
.sidebar-link { display:block; color:#cdd3de; padding:7px 20px 7px 28px;
  text-decoration:none; font-size:0.875rem; transition:all 0.2s; border-left:3px solid transparent; }
.sidebar-link:hover { color:#fff; background:#16213e; border-left:3px solid #e94560; }
.sidebar-link.active { color:#fff; background:#16213e; border-left:3px solid #e94560; font-weight:600; }

/* Hamburger */
.hamburger { display:none; position:fixed; top:16px; left:16px; z-index:200;
  background:#1a1a2e; color:white; border:none; border-radius:8px;
  padding:10px 14px; cursor:pointer; font-size:1.2rem; }

/* Content */
.docs-content { margin-left:260px; padding:40px 60px; max-width:1120px; }

/* Hero */
.doc-hero { display:flex; gap:20px; align-items:center;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
  color:white; padding:32px 36px; border-radius:14px; margin-bottom:32px; }
.doc-hero-icon { font-size:3rem; line-height:1; }
.doc-hero h1 { margin:0 0 8px; font-size:2rem; font-weight:700; }
.doc-hero-sub { margin:0; color:#8892a4; font-size:1.1rem; line-height:1.5; }

/* Breadcrumb */
.breadcrumb { color:#94a3b8; font-size:0.85rem; margin-bottom:24px; }

/* Sections */
.docs-content h2 { font-size:1.35rem; color:#1a1a2e; border-bottom:2px solid #e2e8f0;
  padding-bottom:8px; margin:40px 0 20px; }
.docs-content p { line-height:1.75; color:#374151; margin-bottom:16px; font-size:0.95rem; }
.docs-content ul, .docs-content ol { color:#374151; line-height:1.8; padding-left:20px; margin-bottom:16px; }

/* Steps */
.steps { list-style:none; padding:0; counter-reset:step; }
.steps li { counter-increment:step; margin-bottom:14px; line-height:1.7;
  display:flex; gap:12px; align-items:flex-start; }
.steps li::before { content:counter(step); flex-shrink:0; width:28px; height:28px;
  background:#e94560; color:white; border-radius:50%; display:flex;
  align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; margin-top:2px; }

/* Fields table */
.fields-table { width:100%; border-collapse:collapse; margin:16px 0; font-size:0.9rem; }
.fields-table th { background:#f0f4ff; padding:10px 14px; text-align:left;
  font-size:0.8rem; color:#555; text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
.fields-table td { padding:10px 14px; border-bottom:1px solid #f0f4f0; color:#374151; }
.fields-table td:first-child { font-weight:600; color:#1a1a2e; white-space:nowrap; }

/* Screenshot mockup */
.screenshot-mockup { border:2px solid #e2e8f0; border-radius:10px; overflow:hidden;
  margin:24px 0; background:#f8fafc; }
.mockup-header { background:#1a1a2e; color:white; padding:10px 16px;
  font-size:0.8rem; display:flex; gap:8px; align-items:center; font-weight:500; }
.mockup-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
.mockup-body { padding:20px; overflow-x:auto; }
.screenshot-caption { color:#94a3b8; font-size:0.85rem; margin-top:8px; font-style:italic; }

/* Badges */
.badge { display:inline-block; padding:3px 10px; border-radius:20px;
  font-size:0.75rem; font-weight:600; }
.badge-green  { background:#dcfce7; color:#16a34a; }
.badge-blue   { background:#dbeafe; color:#1d4ed8; }
.badge-orange { background:#ffedd5; color:#c2410c; }
.badge-red    { background:#fee2e2; color:#dc2626; }
.badge-grey   { background:#f1f5f9; color:#64748b; }
.badge-purple { background:#f3e8ff; color:#7c3aed; }
.badge-yellow { background:#fef9c3; color:#a16207; }

/* Tips box */
.tips-box { background:#fffbeb; border-left:4px solid #f59e0b;
  padding:16px 20px; border-radius:0 8px 8px 0; margin:24px 0; }
.tips-box h3 { margin:0 0 10px; color:#92400e; font-size:1rem; }
.tips-box ul { margin:0; padding-left:20px; }
.tips-box li { margin:0 0 6px; color:#78350f; font-size:0.9rem; line-height:1.6; }

/* Related links */
.related-links { display:flex; flex-wrap:wrap; gap:12px; margin-top:36px;
  padding-top:24px; border-top:1px solid #e2e8f0; }
.related-links h3 { width:100%; font-size:0.95rem; color:#1a1a2e; margin:0 0 4px; }
.related-links a { background:#f0f4ff; color:#3b5bdb; padding:8px 16px;
  border-radius:8px; text-decoration:none; font-size:0.875rem; font-weight:500;
  transition:all 0.2s; }
.related-links a:hover { background:#3b5bdb; color:white; }

/* Module grid for index page */
.module-grid { display:grid; grid-template-columns:repeat(3,1fr);
  gap:20px; margin:32px 0; }
.module-card { border:1px solid #e2e8f0; border-radius:12px;
  padding:24px; transition:all 0.25s; background:white; }
.module-card:hover { box-shadow:0 4px 24px rgba(0,0,0,0.08); transform:translateY(-3px);
  border-color:#e94560; }
.module-card .card-icon { font-size:2rem; }
.module-card h3 { margin:12px 0 8px; font-size:1rem; color:#1a1a2e; }
.module-card p { font-size:0.875rem; color:#666; margin:0 0 16px; line-height:1.6; }
.module-card a { color:#e94560; font-weight:600; font-size:0.875rem; text-decoration:none; }
.module-card a:hover { text-decoration:underline; }

/* Mockup table */
.mock-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
.mock-table th { background:#f0f4ff; padding:8px 12px; text-align:left; font-weight:600; color:#555; }
.mock-table td { padding:8px 12px; border-bottom:1px solid #f1f5f9; color:#334155; }
.mock-table tr:hover { background:#f8fafc; }

/* KPI cards */
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px; }
.kpi-card { background:white; border:1px solid #e2e8f0; border-radius:10px; padding:16px; text-align:center; }
.kpi-card .kpi-value { font-size:1.6rem; font-weight:700; color:#1a1a2e; }
.kpi-card .kpi-label { font-size:0.75rem; color:#94a3b8; margin-top:4px; }

/* Bar chart mockup */
.bar-chart { display:flex; align-items:flex-end; gap:8px; height:100px; margin:14px 0; }
.bar-chart .bar { background:#e94560; border-radius:4px 4px 0 0; min-width:20px;
  display:flex; align-items:flex-end; justify-content:center; color:white;
  font-size:0.65rem; padding-bottom:4px; font-weight:600; }

/* Alert feed */
.alert-feed { font-size:0.85rem; }
.alert-feed .alert-item { padding:10px 14px; border-bottom:1px solid #f1f5f9; display:flex; gap:10px; align-items:flex-start; }
.alert-feed .alert-time { color:#94a3b8; font-size:0.8rem; white-space:nowrap; }

/* Responsive */
@media (max-width:768px) {
  .docs-sidebar { transform:translateX(-100%); transition:transform 0.3s; z-index:1000; }
  .docs-sidebar.open { transform:translateX(0); }
  .docs-content { margin-left:0; padding:20px; padding-top:60px; }
  .module-grid { grid-template-columns:1fr; }
  .hamburger { display:block !important; }
  .kpi-row { grid-template-columns:repeat(2,1fr); }
  .doc-hero { flex-direction:column; text-align:center; }
}
</style>
