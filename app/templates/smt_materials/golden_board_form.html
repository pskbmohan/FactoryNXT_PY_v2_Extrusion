{% extends "layout.html" %}
{% block title %}Register Golden Board{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900">Register Golden Board</h1>
    <p class="text-sm text-slate-500 mt-1">Add a new reference board for machine calibration and quality limits.</p>
  </div>

  <!-- Form Card -->
  <form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 space-y-5">

      <!-- Part Number -->
      <div>
        <label for="part_number" class="block text-sm font-medium text-slate-700 mb-1.5">Part Number <span class="text-red-500">*</span></label>
        <input type="text" name="part_number" id="part_number" required value="{{ board.part_number if board else '' }}"
               class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
               placeholder="e.g., GB-PCBA-001" />
      </div>

      <!-- Serial Number -->
      <div>
        <label for="serial_number" class="block text-sm font-medium text-slate-700 mb-1.5">Serial Number <span class="text-red-500">*</span></label>
        <input type="text" name="serial_number" id="serial_number" required value="{{ board.serial_number if board else '' }}"
               class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
               placeholder="e.g., SN-9982-A" />
      </div>

      <!-- Machine ID -->
      <div>
        <label for="machine_id" class="block text-sm font-medium text-slate-700 mb-1.5">Machine ID</label>
        <input type="text" name="machine_id" id="machine_id" value="{{ board.machine_id if board else '' }}"
               class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
               placeholder="e.g., SPI-01 or AOI-02" />
      </div>

      <!-- Limit File Path -->
      <div>
        <label for="limit_file_path" class="block text-sm font-medium text-slate-700 mb-1.5">Limit File Path</label>
        <input type="text" name="limit_file_path" id="limit_file_path" value="{{ board.limit_file_path if board else '' }}"
               class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors font-mono text-xs"
               placeholder="/data/limits/golden_board_001.csv" />
      </div>

    </div>

    <!-- Form Actions -->
    <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3">
      <a href="{{ url_for('smt_materials.golden_board_list') }}"
         class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-medium rounded-lg shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-colors">
        Cancel
      </a>
      <button type="submit"
              class="inline-flex items-center px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-colors">
        <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Save Board
      </button>
    </div>
  </form>
</div>
{% endblock %}
