{% extends "layout.html" %}
{% block title %}Create Routing Step{% endblock %}

{% block content %}
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-900">Create Routing Step</h2>
    <p class="text-sm text-slate-500 mt-1">Define a workstation operation for a product board.</p>
  </div>

  <form class="space-y-4" method="post">
    <div>
      <label for="part_number" class="block text-sm font-medium text-slate-700 mb-1">Part Number *</label>
      <input type="text" id="part_number" name="part_number" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="operation_sequence" class="block text-sm font-medium text-slate-700 mb-1">Sequence Number *</label>
        <input type="number" id="operation_sequence" name="operation_sequence" min="1" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
      </div>
      <div>
        <label for="standard_cycle_time_sec" class="block text-sm font-medium text-slate-700 mb-1">Standard Cycle Time (Seconds) *</label>
        <input type="number" id="standard_cycle_time_sec" name="standard_cycle_time_sec" step="0.01" min="0.01" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
      </div>
    </div>

    <div>
      <label for="operation_name" class="block text-sm font-medium text-slate-700 mb-1">Operation Name *</label>
      <input type="text" id="operation_name" name="operation_name" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required />
    </div>

    <div>
      <label for="workstation_type" class="block text-sm font-medium text-slate-700 mb-1">Workstation Class</label>
      <input type="text" id="workstation_type" name="workstation_type" placeholder="e.g. SMT, AOI, ICT" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>

    <div class="flex items-center gap-3 pt-4 border-t border-slate-200">
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Create Routing Step</button>
      <a href="{{ url_for('routing.list_routing') }}" class="inline-flex items-center px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg border border-slate-300 shadow-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
