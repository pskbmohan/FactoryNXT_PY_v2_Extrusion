{% extends 'layout.html' %}
{% block title %}Log Downtime{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-900">Log Downtime Event</h2>
    <p class="text-sm text-slate-500 mt-1">Record an unplanned machine downtime event.</p>
  </div>
  <form method="post" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Machine ID</label>
        <input type="text" name="machine_id" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Reported By</label>
        <input type="text" name="reported_by" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3">
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Reason Code</label>
        <input type="text" name="reason_code" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Reason Category</label>
        <input type="text" name="reason_category" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3">
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Started At</label>
        <input type="datetime-local" name="started_at" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Ended At</label>
        <input type="datetime-local" name="ended_at" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
      <textarea name="notes" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" rows="3"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-4">
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Save</button>
      <a href="{{ url_for('oee.downtime') }}" class="inline-flex items-center px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg border border-slate-300 shadow-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
