{% extends 'layout.html' %}
{% block title %}{% if line %}Edit SMT Line{% else %}New SMT Line{% endif %}{% endblock %}
{% block content %}
<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 max-w-2xl mx-auto">
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-slate-900">{% if line %}Edit{% else %}New{% endif %} SMT Line</h2>
    <p class="text-sm text-slate-500 mt-1">Configure surface mount technology line details.</p>
  </div>
  <form method="post" class="space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Plant ID</label>
        <input type="text" name="plant_id" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" value="{{ line.plant_id if line }}" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Code</label>
        <input type="text" name="code" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" value="{{ line.code if line }}" required>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
      <input type="text" name="name" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" value="{{ line.name if line }}" required>
    </div>
    <div class="flex items-center">
      <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" name="is_active" id="is_active" {% if not line or line.is_active %}checked{% endif %}>
      <label class="ml-2 block text-sm font-medium text-slate-700" for="is_active">Active</label>
    </div>
    <div class="flex items-center gap-3 pt-4">
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Save</button>
      <a href="{{ url_for('oee.smt_lines') }}" class="inline-flex items-center px-4 py-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg border border-slate-300 shadow-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
