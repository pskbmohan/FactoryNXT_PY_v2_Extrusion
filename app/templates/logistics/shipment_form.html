{% extends "layout.html" %}
{% block title %}New Shipment{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">New Shipment</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Scan packages into this shipment, then verify weight &amp; ship</p>
  </div>
  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Shipment Number *</label>
        <input type="text" name="shipment_number" required
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Customer Name</label>
        <input type="text" name="customer_name"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Delivery Address</label>
      <textarea name="delivery_address" rows="2"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500"></textarea>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Carrier</label>
        <input type="text" name="carrier"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Truck Reference</label>
        <input type="text" name="truck_reference"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Scheduled Ship Date</label>
        <input type="date" name="scheduled_ship_date"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>

    <div class="flex items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">Create Shipment</button>
      <a href="{{ url_for('logistics.index') }}" class="px-6 py-2.5 text-slate-600 dark:text-slate-400 text-sm font-medium">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
