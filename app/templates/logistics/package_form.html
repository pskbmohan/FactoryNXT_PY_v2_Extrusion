{% extends "layout.html" %}
{% block title %}New Package{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-50">New Package</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Pack finished goods; weight & label in queue next</p>
  </div>
  <form method="post" class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Work Order *</label>
        <select name="wo_id" required class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="">— Select —</option>
          {% for wo in work_orders %}<option value="{{ wo.id }}">{{ wo.order_number }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Pack Number *</label>
        <input type="text" name="pack_number" required
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500 font-mono">
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Packaging Spec</label>
        <select name="packaging_spec_id"
                class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
          <option value="">None</option>
          {% for s in specs %}<option value="{{ s.id }}">{{ s.part_number }} — {{ s.packing_method }} ({{ s.units_per_pack or 0 }} units)</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Quantity Packed</label>
        <input type="number" name="quantity_packed"
               class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Packed By</label>
      <input type="text" name="packed_by" value="Operator"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-50 text-sm focus:ring-2 focus:ring-indigo-500">
    </div>

    <div class="flex items-center gap-3 pt-4 border-t border-slate-200 dark:border-slate-700">
      <button type="submit" class="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 shadow-sm">Create Package</button>
      <a href="{{ url_for('logistics.packaging_queue') }}" class="px-6 py-2.5 text-slate-600 dark:text-slate-400 text-sm font-medium">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
