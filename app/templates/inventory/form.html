{% extends "layout.html" %}
{% block title %}New Inventory Item{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-slate-900">New Inventory Item</h1>
    <p class="text-sm text-slate-500 mt-1">Add a new part or material to the inventory system.</p>
  </div>

  <!-- Form Card -->
  <form method="post" class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="p-6 space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Part Number -->
        <div class="md:col-span-2">
          <label for="part_number" class="block text-sm font-medium text-slate-700 mb-1.5">Part Number <span class="text-red-500">*</span></label>
          <input type="text" name="part_number" id="part_number" required
                 class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
                 placeholder="e.g., Res-10k-0402" />
        </div>

        <!-- Description -->
        <div class="md:col-span-2">
          <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5">Description</label>
          <input type="text" name="description" id="description"
                 class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
                 placeholder="e.g., 10k Ohm 1% 0402 Resistor" />
        </div>

        <!-- Quantity On Hand -->
        <div>
          <label for="quantity_on_hand" class="block text-sm font-medium text-slate-700 mb-1.5">Quantity On Hand</label>
          <input type="number" name="quantity_on_hand" id="quantity_on_hand" step="0.01" value="0"
                 class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors" />
        </div>

        <!-- Location -->
        <div>
          <label for="location_id" class="block text-sm font-medium text-slate-700 mb-1.5">Storage Location</label>
          <div class="relative">
            <select name="location_id" id="location_id"
                    class="block w-full appearance-none rounded-lg border-slate-300 bg-white py-2 pl-3 pr-10 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-1 focus:ring-primary-500 transition-colors">
              <option value="">Select a location...</option>
              {% for loc in locations %}
              <option value="{{ loc.id }}">{{ loc.code }} - {{ loc.name }}</option>
              {% endfor %}
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Lot Number -->
        <div class="md:col-span-2">
          <label for="lot_number" class="block text-sm font-medium text-slate-700 mb-1.5">Lot Number</label>
          <input type="text" name="lot_number" id="lot_number"
                 class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 transition-colors"
                 placeholder="e.g., LOT-2024-001" />
        </div>
      </div>

    </div>

    <!-- Form Actions -->
    <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-3">
      <a href="{{ url_for('inventory.inventory_list') }}"
         class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-medium rounded-lg shadow-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-colors">
        Cancel
      </a>
      <button type="submit"
              class="inline-flex items-center px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg shadow-sm hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/20 transition-colors">
        <svg class="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        Save Item
      </button>
    </div>
  </form>
</div>
{% endblock %}
