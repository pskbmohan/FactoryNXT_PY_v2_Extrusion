{% extends 'layout.html' %}
{% block title %}Record Defect{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">Record Defect</h1>
  <p class="text-sm text-slate-500">Log a new manufacturing defect.</p>
</div>
<form method="post" class="max-w-2xl">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Unit ID (Board Serial)</label>
      <input type="text" name="unit_id" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Work Order</label>
      <div class="relative">
        <select name="wo_id" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
          <option value="">None</option>
          {% for wo in work_orders %}<option value="{{ wo.id }}">{{ wo.order_number }}</option>{% endfor %}
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Defect Code</label>
      <input type="text" name="defect_code" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
      <input type="text" name="defect_category" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
      <textarea name="description" rows="2" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3"></textarea>
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm font-medium text-slate-700 mb-1">Disposition</label>
      <div class="relative">
        <select name="disposition" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
          <option>Use As Is</option>
          <option>Rework</option>
          <option>Scrap</option>
          <option>Return to Supplier</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="flex gap-3">
    <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Save</button>
    <a href="{{ url_for('quality_ext.defects') }}" class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg shadow-sm">Cancel</a>
  </div>
</form>
{% endblock %}
