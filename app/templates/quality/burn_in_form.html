{% extends 'layout.html' %}
{% block title %}New Burn-In Session{% endblock %}
{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">New Burn-In Session</h1>
  <p class="text-sm text-slate-500">Queue a new burn-in test for a work order.</p>
</div>
<form method="post" class="max-w-xl">
  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Work Order</label>
    <div class="relative">
      <select name="wo_id" required class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
        {% for wo in work_orders %}<option value="{{ wo.id }}">{{ wo.order_number }}</option>{% endfor %}
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </div>
    </div>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-medium text-slate-700 mb-1">Chamber ID</label>
    <input type="text" name="chamber_id" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
  </div>
  <div class="mb-6">
    <label class="block text-sm font-medium text-slate-700 mb-1">Planned Hours</label>
    <input type="number" step="0.5" name="planned_hours" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
  </div>
  <div class="flex gap-3">
    <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">Queue Session</button>
    <a href="{{ url_for('quality_ext.burn_in') }}" class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg shadow-sm">Cancel</a>
  </div>
</form>
{% endblock %}
