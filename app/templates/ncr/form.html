{% extends "layout.html" %}
{% block title %}Create NCR{% endblock %}
{% block content %}
<div class="mb-6">
  <h2 class="text-2xl font-bold text-slate-900">Create Non-Conformance Report</h2>
  <p class="text-sm text-slate-500">Initiate material quarantine blocks and formal corrective workflows.</p>
</div>
<form class="max-w-2xl space-y-4" method="post">
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Link Work Order (Optional)</label>
    <div class="relative">
      <select name="work_order_id" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
        <option value="">No work order link</option>
        {% for wo in work_orders %}
        <option value="{{ wo.id }}">{{ wo.order_number }}</option>
        {% endfor %}
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </div>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Detailed Disposition / Findings Description *</label>
    <input type="text" name="description" placeholder="Solder bridge discovered post reflow, fails boundary test." required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
  </div>

  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Quarantine Isolation Bin</label>
    <input type="text" name="quarantine_location" value="BIN-QA-REWORK-02" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Severity</label>
      <div class="relative">
        <select name="severity" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
          <option value="Minor">Minor</option>
          <option value="Major">Major</option>
          <option value="Critical">Critical</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
      <div class="relative">
        <select name="status" class="appearance-none block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 pr-10">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Closed">Closed</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="flex gap-3 pt-2">
    <button class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm" type="submit">Create NCR</button>
    <a class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-lg shadow-sm" href="{{ url_for('ncr.list_ncrs') }}">Cancel</a>
  </div>
</form>
{% endblock %}
