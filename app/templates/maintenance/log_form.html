{% extends "layout.html" %}
{% block title %}New Maintenance Log{% endblock %}

{% block content %}
<div class="mb-6">
  <h1 class="text-2xl font-bold text-slate-900">New Maintenance Log</h1>
  <p class="text-sm text-slate-500 mt-1">Record a new maintenance event or repair.</p>
</div>

<form method="post" class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm max-w-3xl">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div>
      <label for="machine_id" class="block text-sm font-medium text-slate-700 mb-1.5">Machine ID <span class="text-red-500">*</span></label>
      <input type="text" name="machine_id" id="machine_id" required
             class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label for="log_type" class="block text-sm font-medium text-slate-700 mb-1.5">Log Type</label>
      <div class="relative">
        <select name="log_type" id="log_type" class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3 appearance-none bg-white pr-10">
          <option>Corrective</option>
          <option>Preventive</option>
          <option>Predictive</option>
          <option>Emergency</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
    </div>
    <div class="md:col-span-2">
      <label for="description" class="block text-sm font-medium text-slate-700 mb-1.5">Description <span class="text-red-500">*</span></label>
      <textarea name="description" id="description" rows="3" required
                class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3"></textarea>
    </div>
    <div class="md:col-span-2">
      <label for="action_taken" class="block text-sm font-medium text-slate-700 mb-1.5">Action Taken</label>
      <textarea name="action_taken" id="action_taken" rows="2"
                class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3"></textarea>
    </div>
    <div>
      <label for="downtime_minutes" class="block text-sm font-medium text-slate-700 mb-1.5">Downtime (minutes)</label>
      <input type="number" name="downtime_minutes" id="downtime_minutes"
             class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label for="technician_id" class="block text-sm font-medium text-slate-700 mb-1.5">Technician ID</label>
      <input type="text" name="technician_id" id="technician_id"
             class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
    <div>
      <label for="performed_at" class="block text-sm font-medium text-slate-700 mb-1.5">Performed At <span class="text-red-500">*</span></label>
      <input type="datetime-local" name="performed_at" id="performed_at" required
             class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
    </div>
  </div>

  <div class="mt-6 flex gap-3 pt-4 border-t border-slate-200">
    <button type="submit" class="inline-flex items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm">
      Save
    </button>
    <a href="{{ url_for('maintenance.logs') }}" class="inline-flex items-center px-4 py-2 bg-white border border-slate-300 text-slate-700 text-sm font-medium rounded-lg shadow-sm hover:bg-slate-50">
      Cancel
    </a>
  </div>
</form>
{% endblock %}
