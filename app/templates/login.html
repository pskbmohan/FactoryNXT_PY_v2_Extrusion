
{% extends "layout-wo-side-bar.html" %}
{% block title %}Login - FactoryNXT{% endblock %}
{% block content %}
<div class="flex min-h-screen items-center justify-center">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Login</h2>
        <p class="text-sm text-slate-500 mt-1">Enter your credentials to access FactoryNXT.</p>
      </div>
      <form class="space-y-4" method="post">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
          <input type="text" name="username" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" required class="block w-full rounded-lg border-slate-300 shadow-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 text-sm py-2 px-3" />
        </div>
        <button class="inline-flex w-full justify-center items-center px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium rounded-lg shadow-sm" type="submit">Login</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
{% endblock %}
