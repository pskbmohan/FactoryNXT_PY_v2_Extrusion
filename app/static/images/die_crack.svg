<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <title>Extrusion Die — Critical Crack (Camera View)</title>
  <defs>
    <linearGradient id="metalBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#83878b"/>
      <stop offset="30%" stop-color="#696d71"/>
      <stop offset="60%" stop-color="#53575b"/>
      <stop offset="100%" stop-color="#3b3f43"/>
    </linearGradient>
    <radialGradient id="pocketDepth" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#282c30"/>
      <stop offset="70%" stop-color="#161a1e"/>
      <stop offset="100%" stop-color="#0a0e12"/>
    </radialGradient>
    <radialGradient id="portHole" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#181c20"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <filter id="metalTexture">
      <feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="3" seed="27"/>
      <feColorMatrix values="0 0 0 0 0.5 0 0 0 0 0.52 0 0 0 0 0.55 0 0 0 0.14 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="#2a2d30"/>
  <rect x="60" y="40" width="840" height="560" rx="16" fill="#3a3d40" filter="url(#softShadow)"/>

  <!-- Die body -->
  <rect x="150" y="80" width="660" height="480" rx="20" fill="url(#metalBody)" filter="url(#metalTexture)"/>

  <!-- Bolt holes -->
  <g fill="#2c3034" stroke="#4a4e52" stroke-width="1.5">
    <circle cx="190" cy="120" r="14"/><circle cx="770" cy="120" r="14"/>
    <circle cx="190" cy="520" r="14"/><circle cx="770" cy="520" r="14"/>
  </g>
  <g fill="#1a1e22">
    <circle cx="190" cy="120" r="6"/><circle cx="770" cy="120" r="6"/>
    <circle cx="190" cy="520" r="6"/><circle cx="770" cy="520" r="6"/>
  </g>

  <!-- Inner pocket -->
  <rect x="220" y="160" width="520" height="320" rx="16" fill="url(#pocketDepth)"/>
  <rect x="220" y="160" width="520" height="320" rx="16" fill="none" stroke="#3a3e42" stroke-width="1"/>

  <!-- Flow channels -->
  <g stroke="#3a4044" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.7">
    <line x1="480" y1="310" x2="295" y2="230"/>
    <line x1="480" y1="310" x2="480" y2="200"/>
    <line x1="480" y1="310" x2="665" y2="230"/>
    <line x1="480" y1="310" x2="295" y2="410"/>
    <line x1="480" y1="310" x2="480" y2="440"/>
    <line x1="480" y1="310" x2="665" y2="410"/>
  </g>

  <!-- Center porthole -->
  <rect x="435" y="290" width="90" height="50" rx="6" fill="url(#portHole)"/>
  <rect x="435" y="290" width="90" height="50" rx="6" fill="none" stroke="#4a5054" stroke-width="1"/>

  <!-- Extrusion ports -->
  <g>
    <ellipse cx="295" cy="230" rx="42" ry="28" fill="#0a0c10" stroke="#3a4044"/>
    <ellipse cx="480" cy="200" rx="50" ry="22" fill="#0a0c10" stroke="#3a4044"/>
    <ellipse cx="665" cy="230" rx="40" ry="30" fill="#0a0c10" stroke="#3a4044"/>
    <ellipse cx="295" cy="410" rx="38" ry="32" fill="#0a0c10" stroke="#3a4044"/>
    <ellipse cx="480" cy="440" rx="46" ry="26" fill="#0a0c10" stroke="#3a4044"/>
    <ellipse cx="665" cy="410" rx="42" ry="28" fill="#0a0c10" stroke="#3a4044"/>
  </g>

  <!-- Bearing lands -->
  <g fill="none" stroke="#5a6064" stroke-width="1" stroke-dasharray="5 3" opacity="0.6">
    <ellipse cx="295" cy="230" rx="54" ry="38"/>
    <ellipse cx="480" cy="200" rx="60" ry="30"/>
    <ellipse cx="665" cy="230" rx="50" ry="40"/>
    <ellipse cx="295" cy="410" rx="48" ry="42"/>
    <ellipse cx="480" cy="440" rx="56" ry="34"/>
    <ellipse cx="665" cy="410" rx="52" ry="38"/>
  </g>

  <!-- Port labels -->
  <g font-family="monospace" font-size="10" fill="#8a9094" opacity="0.7">
    <text x="295" y="258" text-anchor="middle">P1</text>
    <text x="480" y="218" text-anchor="middle">P2</text>
    <text x="665" y="258" text-anchor="middle">P3</text>
    <text x="295" y="448" text-anchor="middle">P4</text>
    <text x="480" y="462" text-anchor="middle">P5</text>
    <text x="665" y="448" text-anchor="middle">P6</text>
  </g>

  <!-- ========= CRACKS (CRITICAL) — revealed after AI analysis ========= -->
  <g class="die-defect">
    <!-- Critical radial crack from P2 bearing land -->
    <g filter="url(#glow)">
      <path d="M455 178 L462 165 L458 152 L467 138 L463 125 L472 110"
            fill="none" stroke="#cc2020" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M462 165 L475 160 L482 148"
            fill="none" stroke="#cc2020" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
    </g>
    <!-- Secondary crack branch -->
    <path d="M467 138 L458 130 L463 118" fill="none" stroke="#ee3030" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

    <!-- Crack at P5 (lower bearing) -->
    <path d="M455 428 L460 418 L456 408 L462 398 L457 388"
          fill="none" stroke="#cc2020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Chipping near P2 crack origin -->
    <g>
      <polygon points="475,152 482,148 484,156 478,160" fill="#d0d4d8" stroke="#a0a4a8" stroke-width="1" opacity="0.7"/>
      <polygon points="482,146 487,142 489,150" fill="#d8dcd0" stroke="#b0b4b8" stroke-width="0.8" opacity="0.6"/>
    </g>

    <!-- Crack annotation callouts (small) -->
    <g font-family="monospace" font-size="9" fill="#ef4444" font-weight="600">
      <circle cx="472" cy="110" r="3" fill="#ef4444"/>
      <text x="490" y="112" opacity="0.9">CRACK RADIAL</text>
      <circle cx="457" cy="388" r="3" fill="#ef4444"/>
      <text x="474" y="390" opacity="0.9">CRACK BEARING</text>
      <text x="490" y="155" fill="#f59e0b" opacity="0.8" font-size="8">CHIP</text>
    </g>
  </g>

  <!-- Scale markers -->
  <g font-family="monospace" font-size="9" fill="#6a7074" opacity="0.6">
    <text x="80" y="90">0</text>
    <text x="470" y="90">200mm</text>
    <text x="860" y="90">400mm</text>
  </g>

  <!-- Die label -->
  <rect x="720" y="140" width="60" height="20" rx="2" fill="#b0b4b8" opacity="0.6"/>
  <text x="750" y="154" text-anchor="middle" font-family="monospace" font-size="7" fill="#2a2d30">DIE-0137</text>
</svg>
